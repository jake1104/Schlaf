<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schlaf — Schläfli renderer</title>
<meta name="description" content="Type a Schläfli symbol and render the polytope: any dimension, Euclidean, spherical or hyperbolic." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<header class="masthead">
<div class="masthead-title">
<h1>Schlaf</h1>
<p>슐레플리 기호</p>
</div>
</header>
<main>
<aside class="panel">
<section class="group">
<h2 class="group-title"><span>Specimen</span></h2>
<label class="field-label" for="expr">슐레플리 기호</label>
<input id="expr" class="symbol-input" value="{4,3}" spellcheck="false" autocomplete="off" autocapitalize="off" />
<p class="reading" id="reading"></p>
<p class="error" id="err" role="alert"></p>
</section>
<section class="group">
<h2 class="group-title"><span>View</span></h2>
<div class="control-stack">
<label for="proj">투영</label>
<select id="proj"><option value="perspective">원근</option><option value="stereographic">입체투영</option></select>
</div>
<label class="check"><span>쌍곡면</span><input id="hyper" type="checkbox" /></label>
<label class="check"><span>자동회전</span><input id="spin" type="checkbox" checked /></label>
</section>
<section class="group">
<h2 class="group-title"><span>Appearance</span></h2>
<label class="check"><span>면 표시</span><input id="showFaces" type="checkbox" checked /></label>
<div class="control">
<label for="faceColor">면 색상</label>
<input id="faceColor" type="color" value="#1D5FBF" />
</div>
<div class="control-stack">
<div class="control-row"><label for="faceOpacity">면 불투명도</label><output id="faceOpacityOut" for="faceOpacity">0.55</output></div>
<input id="faceOpacity" type="range" min="0" max="1" step="0.01" value="0.55" />
</div>
<label class="check"><span>간선 표시</span><input id="showEdges" type="checkbox" checked /></label>
</section>
<section class="group">
<h2 class="group-title"><span>Rotation</span></h2>
<div class="control-stack">
<div class="control-row"><label for="range">타일링 범위</label><output id="rangeOut" for="range">3</output></div>
<input id="range" type="range" min="1" max="4" step="1" value="3" />
</div>
<div class="control-stack">
<div class="control-row"><label for="xw">XW</label><output id="xwOut" for="xw">0.00</output></div>
<input id="xw" type="range" min="0" max="6.28" step="0.01" value="0" />
</div>
<div class="control-stack">
<div class="control-row"><label for="yw">YW</label><output id="ywOut" for="yw">0.00</output></div>
<input id="yw" type="range" min="0" max="6.28" step="0.01" value="0" />
</div>
<div class="control-stack">
<div class="control-row"><label for="zw">ZW</label><output id="zwOut" for="zw">0.00</output></div>
<input id="zw" type="range" min="0" max="6.28" step="0.01" value="0" />
</div>
</section>
<section class="group">
<h2 class="group-title"><span>Catalogue</span></h2>
<div class="presets" id="presets"></div>
</section>
</aside>
<section class="view">
<figure class="plate-figure">
<div class="plate"><canvas id="c"></canvas></div>
<figcaption class="plate-caption">
<div class="caption-line">
<span class="caption-label">Plate</span>
<span class="caption-symbol" id="plateSymbol">{4,3}</span>
<span class="caption-stats" id="info"></span>
</div>
<span class="caption-hint">드래그 회전 · 휠 줌 · 우드래그 이동</span>
</figcaption>
</figure>
</section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
